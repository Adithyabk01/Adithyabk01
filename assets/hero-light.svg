<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="200" style="background:#ffffff; border-radius: 12px;">
  <defs>
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.1"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(2, 132, 199, 0.05)" stroke-width="1"/>
    </pattern>
    <style>
      .hero-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        fill: url(#title-grad);
      }
      .hero-subtitle {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 18px;
        fill: #57606a;
      }
      .typewriter-text {
        font-family: "Fira Code", "Courier New", Courier, monospace;
        font-size: 16px;
        font-weight: 600;
        fill: #0284c7;
      }
      .cursor {
        animation: blink 1s infinite;
        fill: #0284c7;
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- Background Card & Grid -->
  <rect width="800" height="200" rx="12" fill="#ffffff" stroke="url(#border-grad)" stroke-width="1.5"/>
  <rect width="800" height="200" rx="12" fill="url(#grid)" />

  <!-- Decorative Corner Glows -->
  <circle cx="0" cy="0" r="140" fill="#0284c7" opacity="0.08" filter="blur(20px)" />
  <circle cx="800" cy="200" r="140" fill="#4f46e5" opacity="0.08" filter="blur(20px)" />

  <!-- Content Group centered -->
  <g transform="translate(400, 70)" text-anchor="middle">
    <text y="0" class="hero-title">Adithya B K</text>
    <text y="36" class="hero-subtitle">AI/ML Enthusiast • Full-Stack Developer • Data Analytics Explorer</text>
    
    <!-- Code / Typing Banner -->
    <g transform="translate(0, 72)">
      <rect x="-240" y="-22" width="480" height="36" rx="18" fill="#ffffff" stroke="#e1e4e8" stroke-width="1"/>
      <text x="0" y="2" class="typewriter-text" text-anchor="middle">⚡ Building Practical &amp; Intelligent Web Solutions <tspan class="cursor">█</tspan></text>
    </g>
  </g>
</svg>